services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: elearning_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_URL=/app/data/sqlite.db
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
