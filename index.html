<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./public/images/2c06b6fab7e6a9490c046e362160f2d0.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet" />
    <title>PKBM Menuju Makmur</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Update browser tab icon and title with institution data
      (function() {
        fetch('/api/institution-profile')
          .then(function(res) { return res.json(); })
          .then(function(data) {
            if (data.success && data.data) {
              if (data.data.foto) {
                var link = document.querySelector("link[rel~='icon']");
                if (!link) {
                  link = document.createElement('link');
                  link.rel = 'icon';
                  document.head.appendChild(link);
                }
                link.href = data.data.foto;
              }
              if (data.data.namaLembaga) {
                document.title = data.data.namaLembaga;
              }
            }
          })
          .catch(function() {});
      })();
    </script>
  </body>
</html>
